<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estado del servicio</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            text-align: center;
            padding: 2.5rem 3rem;
            border-radius: 12px;
            background: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 8px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0.5rem 0;
        }
        p {
            color: #94a3b8;
            margin: 0.25rem 0 0;
        }
        a {
            display: inline-block;
            margin-top: 1.25rem;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="dot"></span><span th:text="${status}">En línea</span></h1>
        <p>MatricuApp backend</p>
        <p th:text="${timestamp}">2026-01-01 00:00:00</p>
        <a href="/swagger-ui/index.html">Ver documentación de la API (Swagger)</a>
    </div>
</body>
</html>
