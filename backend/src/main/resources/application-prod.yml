spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

app:
  allowed-origins: https://matricuapp.gabogomez.dev
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
