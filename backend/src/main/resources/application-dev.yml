spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/matricuapp}
    username: ${DATABASE_USERNAME:matricuapp}
    password: ${DATABASE_PASSWORD:matricuapp}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

app:
  allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-long-replace-in-prod}
    expiration: 3600
